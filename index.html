<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="開発中のゲーム『怒破我喜さま／ドパガキ魔王』のガチャ試遊版。魔王と一緒に、何度でも召魂の儀を。">
<title>ドパガキ魔王 召魂の儀（開発中・ガチャ試遊版）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%2307040b%22/%3E%3Cpath d=%22M4 3h2v3H4zM10 3h2v3h-2zM5 7h6v5H5z%22 fill=%22%23ff2a4a%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ガチャ試遊版（GitHub Pages）：召魂の儀の画面が主役。操作は下に小さく
   PC：Space＝単発／Enter＝十連／S＝スキップ／R＝魔王軍。スマートフォン：下のボタン
   ===================================================================== */
:root { --bg: #07040b; --ink: #f1e8f8; --dim: #a99bb8; --gold: #e8c27a; --line: #3a2a44; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'DotGothic16', monospace; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
body { display: flex; flex-direction: column; height: 100dvh; min-height: 100%; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); user-select: none; -webkit-user-select: none; }
header { display: flex; align-items: center; gap: 10px; padding: 6px 12px; min-height: 36px; }
header h1 { margin: 0; font-weight: normal; font-size: clamp(15px, 3.4vw, 20px); color: #ffe3a6; letter-spacing: .05em; white-space: nowrap; }
header .badge { font-size: 11px; color: var(--dim); border: 1px solid var(--line); padding: 2px 6px; white-space: nowrap; }
header .sp { flex: 1; }
#stage { flex: 1 1 auto; min-height: 160px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
#out { image-rendering: pixelated; image-rendering: crisp-edges; display: block; cursor: pointer; touch-action: manipulation; }
/* 台詞と結果（スマートフォンでも読める大きさ。画面の外の下に置き、キャラクターを隠さない） */
#cap { padding: 4px 14px 2px; min-height: 2.6em; }
#line { font-size: clamp(14px, 3.6vw, 17px); line-height: 1.45; color: #ffe9f0; }
#line b { color: var(--gold); font-weight: normal; margin-right: .6em; font-size: .85em; }
#result { font-size: clamp(12px, 3vw, 14px); color: var(--dim); line-height: 1.6; margin-top: 2px; }
#result small { color: #8a7a96; margin: 0 .5em 0 .2em; font-size: .9em; }
.newmark { display: inline-block; color: #1a0e14; background: #ffd36b; font-size: 10px; line-height: 1; padding: 2px 3px 1px; margin: 0 .5em 0 .25em; vertical-align: 2px; }
/* 操作（小さく・まとめて） */
#bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; padding: 6px 10px 10px; }
#bar button { font: inherit; color: var(--ink); background: #1a1024; border: 2px solid #4a3a54; padding: 8px 14px; font-size: 15px; cursor: pointer; min-height: 44px; touch-action: manipulation; }
#bar button:hover:not(:disabled) { border-color: #ffe3a6; }
#bar button:active:not(:disabled) { transform: translateY(1px); }
#bar button:disabled { opacity: .35; cursor: default; }
#bar button.main { background: #3a0c1c; border-color: var(--gold); }
#bar button.ten { background: #4a1028; }
#bar .k { color: var(--gold); font-size: 11px; margin-left: 6px; }
#snd { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
#snd input { width: 90px; accent-color: var(--gold); }
#snd button { min-height: 44px; padding: 4px 10px; font-size: 13px; }
@media (hover: none) { #bar .k { display: none; } } /* タッチの端末ではキーの表示を出さない */
@media (max-width: 520px) { #bar button { padding: 8px 10px; font-size: 14px; } #bar { gap: 5px; } header .badge { font-size: 10px; } }
/* スマートフォンの横画面：操作と台詞を画面の右に並べ、召魂の儀の画面を大きく */
#main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
#side { display: flex; flex-direction: column; }
@media (orientation: landscape) and (max-height: 540px) {
  header { min-height: 28px; padding: 2px 10px; } header h1 { font-size: 14px; }
  #main { flex-direction: row; }
  #side { width: min(300px, 38vw); justify-content: center; overflow-y: auto; }
  #bar { justify-content: flex-start; padding: 4px 8px; } #bar button { padding: 6px 10px; font-size: 14px; }
  #cap { padding: 4px 8px; }
}
/* スマートフォンの縦画面：召魂の儀の画面を上に詰め、台詞と操作をすぐ下に */
@media (orientation: portrait) { #stage { flex: 0 0 auto; height: min(75vw, 60dvh); } #side { flex: 1 1 auto; justify-content: flex-start; } }
/* 埋め込み・開発用の要素は試遊版では使わない */
#autoBox, #bHold, #bResume, #bExit, #decideMsg, #bStop, #proposeMsg, #bAccept, #bDecline, #stopBanner, #nextPanel, #holdBar { display: none !important; }
/* 名簿 */
#roster { position: fixed; inset: 0; background: rgba(4, 2, 8, .92); display: none; place-items: center; z-index: 8; padding: 10px; }
#roster.show { display: grid; }
#roster .box { background: #0e0916; border: 2px solid var(--gold); padding: 14px 14px 12px; width: min(820px, 96vw); max-height: 92dvh; overflow: auto; }
#roster h3 { margin: 0 0 6px; font-weight: normal; color: #ffe3a6; font-size: 20px; }
#roster .sub { color: var(--dim); font-size: 13px; line-height: 1.7; margin-bottom: 10px; }
#roster .sub b { color: var(--ink); font-weight: normal; }
#roster .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
#roster .c { border: 2px solid var(--rc); background: #140c1e; text-align: center; padding: 6px 4px; font-size: 13px; }
#roster .c.none { border-color: #2a2034; color: #4a3a54; }
#roster canvas { image-rendering: pixelated; width: 80px; height: 80px; display: block; margin: 0 auto 4px; }
#roster .lv { color: var(--gold); }
#roster .acts { display: flex; gap: 8px; justify-content: space-between; margin-top: 12px; flex-wrap: wrap; }
#roster button { font: inherit; background: #1a1024; color: #fff; border: 2px solid #4a3a54; padding: 8px 16px; cursor: pointer; min-height: 44px; }
#roster #bReset2 { color: #c8a0a8; border-color: #4a2a34; font-size: 13px; }
/* タイトル */
#title { position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 40%, #2a1236 0%, #07040b 70%); cursor: pointer; text-align: center; padding: 20px; }
html.title #title { display: flex; }
#title .t1 { font-size: clamp(30px, 8vw, 54px); color: #ffe3a6; letter-spacing: .08em; text-shadow: 0 0 18px rgba(255, 90, 112, .45); }
#title .t2 { font-size: clamp(14px, 3.6vw, 18px); color: #ffd0d8; }
#title .go { margin-top: 18px; font-size: clamp(16px, 4vw, 22px); color: #fff; border: 2px solid var(--gold); padding: 10px 26px; background: #3a0c1c; animation: pulse 1.6s ease-in-out infinite; }
#title .note { margin-top: 18px; font-size: 12px; color: var(--dim); line-height: 1.7; max-width: 520px; }
@keyframes pulse { 50% { box-shadow: 0 0 18px rgba(232, 194, 122, .5); } }
</style>
</head>
<body>
<header><h1>ドパガキ魔王 召魂の儀</h1><span class="badge">開発中・ガチャ試遊版</span><span class="sp"></span></header>
<div id="main">
<div id="stage"><canvas id="out" aria-label="召魂の儀の画面"></canvas></div>
<div id="side">
<div id="cap"><div id="line"></div><div id="result"></div></div>
<div id="bar">
  <button class="main" id="b1">単発召魂<span class="k">Space</span></button>
  <button class="main ten" id="b10">十連召魂<span class="k">Enter</span></button>
  <button id="bSkip">スキップ<span class="k">S</span></button>
  <button id="bRoster">魔王軍<span class="k">R</span></button>
  <span id="snd"><label for="vol">音量</label><input id="vol" type="range" min="0" max="100" value="90"><button id="bMute" aria-pressed="false">音を消す</button></span>
  <span id="autoBox"><span id="autoMsg"></span><i id="autoTrack"><i id="autoBar"></i></i></span>
</div>
</div>
</div>
<div id="roster"><div class="box"><h3>魔王軍 名簿</h3><div class="sub" id="rosterSub"></div><div class="grid" id="rosterGrid"></div>
  <div class="acts"><button id="rosterClose">閉じる（Esc）</button><button id="bReset2">記録をリセット</button></div></div></div>
<div id="title" role="button" tabindex="0" aria-label="はじめる">
  <div class="t1">ドパガキ魔王<br>召魂の儀</div>
  <div class="t2">魔王と一緒に、何度でも。（魂晶 ∞）</div>
  <div class="go">タップ／クリックで はじめる</div>
  <div class="note">開発中のゲームのガチャ部分だけの試遊版です。登場する魔族・レア度・確率・台詞は試作中のもので、正式な仕様ではありません。<br>音が出ます。記録はこのブラウザの中だけに保存されます。</div>
</div>
<script>window.GACHA_DEMO = true;</script>
<script src="./js/data.js"></script>
<script src="./js/demon_sprites.js"></script>
<script src="./js/fx.js"></script>
<script type="module" src="./gacha/gacha.js"></script>
</body>
</html>
